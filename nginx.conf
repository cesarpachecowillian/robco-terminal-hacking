server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Always revalidate so a rebuilt image is picked up immediately (ETag keeps it cheap)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }

  # wav is missing from some mime.types; keep revalidation (location regex replaces the one above)
  location ~* \.wav$ {
    default_type audio/wav;
    add_header Cache-Control "no-cache";
  }
}
